<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vida Diária</title>
<link rel="icon" href="/assets/icon.png" />
<script>
  // Abre o site no idioma do navegador de quem visita; português se não houver versão.
  (function () {
    var available = ["de", "en", "es", "fr", "it", "pt"];
    var wanted = (navigator.languages || [navigator.language || 'pt']).map(function (l) { return l.slice(0, 2).toLowerCase(); });
    var pick = wanted.find(function (l) { return available.indexOf(l) !== -1; }) || 'pt';
    location.replace('/' + pick + '/');
  })();
</script>
</head>
<body>
<noscript><ul><li><a href="/de/">DE</a></li><li><a href="/en/">EN</a></li><li><a href="/es/">ES</a></li><li><a href="/fr/">FR</a></li><li><a href="/it/">IT</a></li><li><a href="/pt/">PT</a></li></ul></noscript>
</body>
</html>
